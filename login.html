<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SHS Volunteering</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <main class="auth-container">
        <h1>SHS Volunteering</h1>
        <p class="subtitle">Sign in to continue</p>

        <section class="card">
            <div class="field-group">
                <label for="email">Email</label>
                <input id="email" type="email" placeholder="you@example.com" autocomplete="email">
            </div>

            <div class="field-group">
                <label for="password">Password</label>
                <input id="password" type="password" placeholder="Minimum 6 characters" autocomplete="current-password">
            </div>

            <div class="actions">
                <button id="sign-up-btn" type="button">Sign Up</button>
                <button id="sign-in-btn" type="button">Sign In</button>
                <button id="sign-out-btn" type="button" disabled>Sign Out</button>
            </div>

            <p id="status" class="status" aria-live="polite">Not signed in</p>
        </section>
    </main>

    <script type="module" src="script.js"></script>
</body>
</html>
