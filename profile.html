<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SHS Volunteering - Profile</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="styles.css">
    <style>
        /* Keeping your specific profile layout styles */
        .profile-container {
            flex: 1;
            max-width: 1200px;
            margin: 2rem auto;
            padding: 0 2rem;
            width: 100%;
        }

        .user-info {
            display: flex;
            align-items: center;
            gap: 2rem;
            margin-bottom: 3rem;
            background: white;
            padding: 2rem;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }

        .pfp-circle {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            background: linear-gradient(135deg, #10b981, #2b5229);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 1.2rem;
            cursor: pointer;
            position: relative;
            transition: opacity 0.2s ease;
            overflow: hidden;
        }

        .pfp-circle:hover::after {
            content: '📷';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 32px;
            z-index: 2;
        }

        .user-details h2 {
            font-size: 2rem;
            color: #2b5229;
            margin-bottom: 0.5rem;
        }

        .saved-section h3 {
            font-size: 1.8rem;
            color: #2b5229;
            margin-bottom: 1.5rem;
        }

        @media (max-width: 768px) {
            .user-info { flex-direction: column; text-align: center; }
        }
    </style>
</head>
<body>
    <header class="header">
        <div class="nav-container">
            <div class="brand">
                <h1>SHS Volunteering</h1>
                <div class="nav-links">
                    <a href="index.html">Home</a>
                    <a href="credits.html">Credits</a>
                    <a href="profile.html" class="active">Profile</a>
                </div>
            </div>
            <div class="logo-container">
                <img src="patriot-logo.png" alt="SHS Logo" class="logo">
            </div>
            <div class="search-bar">
                <i class="fa fa-search"></i>
                <input type="text" placeholder="search...">
            </div>
        </div>
        <div class="gold-divider"></div>
    </header>

    <main class="profile-container">
        <section class="user-info">
            <div class="pfp-circle" id="pfpCircle">
                <img id="profileImage" src="" alt="" style="display: none; width: 100%; height: 100%; object-fit: cover; border-radius: 50%;">
                <span id="pfpText">pfp</span>
                <input type="file" id="photoUpload" accept="image/*" style="display: none;">
            </div>
            <div class="user-details">
                <h2>Pat Riot</h2>
                <p>Class of 2027</p>
            </div>
        </section>
        <section class="saved-section">
            <h3>Saved</h3>
            <div class="card-grid">
                <div class="card"></div>
                <div class="card"></div>
                <div class="card"></div>
            </div>
        </section>
    </main>

    <footer class="bottom-bar">
        <i class="fa-regular fa-comment-dots"></i>
        <div class="fab-container">
            <button class="fab-button">+</button>
        </div>
        <i class="fa-regular fa-bookmark"></i>
    </footer>

    <script src="script.js"></script>
    <script>
        // Photo upload functionality specific to profile page
        const pfpCircle = document.getElementById('pfpCircle');
        const photoUpload = document.getElementById('photoUpload');
        const profileImage = document.getElementById('profileImage');
        const pfpText = document.getElementById('pfpText');

        pfpCircle?.addEventListener('click', () => photoUpload.click());

        photoUpload?.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = (event) => {
                    profileImage.src = event.target.result;
                    profileImage.style.display = 'block';
                    pfpText.style.display = 'none';
                };
                reader.readAsDataURL(file);
            }
        });
    </script>
</body>
</html>
