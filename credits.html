<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SHS Volunteering - Credits</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>

    <header class="header">
        <div class="nav-container">
            <div class="brand">
                <h1>SHS Volunteering</h1>
                <div class="nav-links">
                    <a href="index.html">Home</a>
                    <a href="credits.html" class="active">Credits</a>
                    <a href="profile.html">Profile</a>
                </div>
            </div>
            <div class="logo-container">
                <img src="patriot-logo.png" alt="SHS Logo" class="logo">
            </div>
            <div class="search-bar">
                <i class="fa fa-search"></i>
                <input type="text" placeholder="search...">
            </div>
        </div>
        <div class="gold-divider"></div>
    </header>

    <main class="main-content">
        <div class="credits-wrapper">
            <h2 class="page-title">The Team Behind SHS Volunteering</h2>

            <section class="credits-section">
                <h3 class="team-header"><i class="fa-solid fa-code"></i> Coding Team</h3>
                <div class="credits-grid">
                    <div class="credit-card">
                        <span class="member-name">Jungmin Lee</span>
                        <span class="member-role">Lead Developer / API Lead</span>
                    </div>
                    <div class="credit-card">
                        <span class="member-name">[Name]</span>
                        <span class="member-role">Software Engineer</span>
                    </div>
                </div>
            </section>

            <section class="credits-section">
                <h3 class="team-header"><i class="fa-solid fa-palette"></i> Design Team</h3>
                <div class="credits-grid">
                    <div class="credit-card">
                        <span class="member-name">[Name]</span>
                        <span class="member-role">UI/UX Designer</span>
                    </div>
                </div>
            </section>

            <section class="credits-section">
                <h3 class="team-header"><i class="fa-solid fa-bullhorn"></i> Outreach Team</h3>
                <div class="credits-grid">
                    <div class="credit-card">
                        <span class="member-name">[Name]</span>
                        <span class="member-role">Community Outreach</span>
                    </div>
                </div>
            </section>
        </div>
    </main>

    <footer class="bottom-bar">
        <i class="fa-regular fa-comment-dots"></i>
        <div class="fab-container">
            <button class="fab-button">+</button>
        </div>
        <i class="fa-regular fa-bookmark"></i>
    </footer>

    <script src="script.js"></script>
</body>
</html>
